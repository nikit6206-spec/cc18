name: Build tweak package

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Theos
        uses: Randomblock1/theos-action@v1
      - name: Build RootHide package
        run: make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide
      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: iPadOS18CC-deb
          path: packages/*.deb
          if-no-files-found: error
